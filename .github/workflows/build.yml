
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q "$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)" -d extracted
          echo "PROJECT_DIR=$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found in ZIP"
            find extracted -maxdepth 4 -type f | head -n 80
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug


      - uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
