
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q "$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)" -d extracted
          echo "PROJECT_DIR=$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
