
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q Matjar_Laser_Android_Project_v2.zip -d extracted
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/MatjarLaserAndroid" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Android-APK
          path: extracted/MatjarLaserAndroid/app/build/outputs/apk/debug/*.apk
